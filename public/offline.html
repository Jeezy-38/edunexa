<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline</title>
<style>
:root{color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6ff;color:#192335;text-align:center;padding:24px}
@media(prefers-color-scheme:dark){body{background:#0f172a;color:#e5e9f2}.c{background:#1e293b!important}}

</style></head><body><div class="c">

<h1>You're offline / Hauna mtandao</h1>

<button onclick="location.reload()">Retry / Jaribu tena</button>
</div></body></html>
